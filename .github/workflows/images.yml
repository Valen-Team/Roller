name: Images
# Builds the Harness images whose licences allow redistribution and publishes
# them to GitHub Container Registry. scripts/prebuilt_images.py lists them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - id: plan
        run: echo "images=$(python scripts/prebuilt_images.py)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    name: ${{ matrix.image.harness }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      REF: ${{ matrix.image.ref }}
      CONTEXT: ${{ matrix.image.context }}
      VERSION: ${{ matrix.image.version }}
      LICENSE: ${{ matrix.image.license }}
      CHECK: ${{ matrix.image.check }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=${LICENSE}" \
            --label "org.opencontainers.image.description=Roller Harness image built from ${CONTEXT}" \
            -t "$REF" "$CONTEXT"
      - name: Check the pinned version inside the image
        run: |
          reported="$(docker run --rm --entrypoint /bin/bash "$REF" -c "$CHECK")"
          echo "$reported"
          case "$reported" in *"$VERSION"*) ;; *) echo "expected $VERSION"; exit 1 ;; esac
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$REF"
