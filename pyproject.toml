[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "roller-agent"
dynamic = ["version", "readme"]
description = "Batch collection of agentic trajectories across models and harnesses"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Roller contributors"}]
keywords = ["agents", "agent-trajectories", "docker", "evaluation", "sft"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0,<7", "zstandard>=0.22"]

[project.optional-dependencies]
test = ["pytest", "jsonschema", "tomli; python_version < '3.11'"]
swebench-pro = ["pyarrow>=14"]
vials = ["pyarrow>=14"]
zerobench = ["datasets>=2.14", "Pillow>=10"]
pdf = [
    "pypdfium2>=4.30; python_version >= '3.11'",
    "Pillow>=13; python_version >= '3.11'",
]
e2b = ["e2b==2.64.0; python_version >= '3.11'"]
stirrup = ["stirrup==0.2.1; python_version >= '3.12'"]

[project.urls]
Homepage = "https://github.com/Valen-Team/Roller"
Documentation = "https://valen-team.github.io/roller/"
Issues = "https://github.com/Valen-Team/Roller/issues"

[project.scripts]
roller = "roller.cli:main"

[tool.hatch.version]
path = "src/roller/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/roller"]

# `roller init` copies these starter files into the user's working directory.
[tool.hatch.build.targets.wheel.force-include]
"examples/tasks" = "roller/examples/tasks"
"examples/config" = "roller/examples/config"
"examples/benchmarks" = "roller/examples/benchmarks"
"examples/env/api.env.example" = "roller/examples/env/api.env.example"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples/tasks", "/examples/config", "/examples/benchmarks", "/examples/env/api.env.example"]

# PyPI does not resolve relative paths, so README links and images are pinned
# to the release tag when the package metadata is built.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/Valen-Team/Roller/v$HFPR_VERSION/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/Valen-Team/Roller/blob/v$HFPR_VERSION/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/Valen-Team/Roller/blob/v$HFPR_VERSION/\1)'

# Stirrup needs moviepy, which caps Pillow below the version the pdf extra requires.
[tool.uv]
conflicts = [[{extra = "pdf"}, {extra = "stirrup"}]]

[tool.ruff]
target-version = "py310"
# These files are data, checksummed byte for byte: task inputs, coverage
# fixtures, and the SWE-Bench Pro grader whose source is part of its protocol.
extend-exclude = [
  "examples/coverage/fixtures",
  "examples/tasks/files",
  "src/roller/benches/swebench_pro/grader.py",
]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade and bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
  "E501",  # Line length is the formatter's job; long strings stay as written.
  "B905",  # zip() without strict= is used where truncation is intended.
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Package facades re-export names.
"tests/*" = ["B023"]  # Helpers defined in a loop are called within the same iteration.
# Stand-alone scripts put the repository on sys.path before importing roller.
"scripts/*" = ["E402"]
"examples/coverage/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
