[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roller-agent"
version = "0.2.0"
description = "Batch collection of agentic trajectories across models and harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Roller contributors"}]
keywords = ["agents", "agent-trajectories", "docker", "evaluation", "sft"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest", "tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/Valen-Team/Roller"
Documentation = "https://github.com/Valen-Team/Roller/blob/main/docs/en/index.md"
Issues = "https://github.com/Valen-Team/Roller/issues"

[project.scripts]
roller = "roller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"roller.viewer" = ["static/*"]
"roller" = ["assets/*.py", "assets/*.mjs", "assets/hermes/*", "assets/opencode/*", "assets/deepseek/*", "assets/pi/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
