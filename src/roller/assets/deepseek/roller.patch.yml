# Fixed additions to the selected SDK profile. The native agent loop, tool
# plugins and session persistence are left under dsh's ownership.
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: llm-deepseek
  config:
    models: !!js "[{id: process.env.ROLLER_DEEPSEEK_MODEL, contextWindow: Number(process.env.DSH_CONTEXT_WINDOW), maxTokens: Number(process.env.ROLLER_DEEPSEEK_OUTPUT_TOKENS), inputModalities: process.env.ROLLER_DEEPSEEK_INPUT_MODALITIES.split(',')}]"
    retryPolicy:
      mode: normal
      maxRetries: 0
- insert:
    - id: roller-request-journal
      name: /roller/deepseek_journal.mjs
